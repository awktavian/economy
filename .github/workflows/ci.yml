name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renamed from `build` on 2026-11-13: this job never built anything that
  # survived contact with the runner. It is the native-trust census leg now,
  # which is a text scan; the corpus build lives in `soundness`.
  native-trust:
    name: Native-trust census ratchet
    runs-on: [self-hosted, lean]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native-trust census ratchet (undisclosed native_decide sites may not rise)
        # Counts LIVE tactic sites of the tokens that mint a `_native.*` witness
        # axiom (native_decide, decide +native, bv_decide, Lean.ofReduceBool), with
        # comments and strings masked by Lean's grammar, and compares the number
        # that carry no disclosure against .github/native-decide-baseline.json. A native_decide result is
        # compiler-trusted, not kernel-checked; this leg keeps new ones from
        # arriving unlabelled. Text scan, no Lean, seconds.
        #
        # The estate keeps ONE census, in awkronos/reality
        # (scripts/native_decide_census.py); it is read from the runner's reality
        # object store, never copied into this repository. rc 1 = the count rose.
        # rc 2 = UNMEASURED (control did not fire, unreadable file or baseline) and
        # fails. A runner with no reality checkout cannot measure: that is reported
        # as a warning naming the absence, never as a pass on a count of zero.
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          R="${REALITY_CHECKOUT:-$HOME/reality}"
          CENSUS="${RUNNER_TEMP:-/tmp}/native_decide_census.py"
          git -C "$R" fetch -q origin main 2>/dev/null || true
          if git -C "$R" show origin/main:scripts/native_decide_census.py > "$CENSUS" 2>/dev/null \
              && grep -q -- '--ratchet' "$CENSUS"; then
            python3 "$CENSUS" --self-test
            python3 "$CENSUS" --root "$GITHUB_WORKSPACE" --ratchet "$GITHUB_WORKSPACE/.github/native-decide-baseline.json" --summary | tail -n 3
            exit "${PIPESTATUS[0]}"
          else
            echo "::warning::native-trust census UNMEASURED on this runner: no reality checkout at $R carrying scripts/native_decide_census.py with --ratchet; the ratchet did not run here"
          fi

      # The corpus build moved to the `soundness` job, where it runs behind a
      # symlink preflight and a build-slot lease on the toolchain this runner
      # already pins. `leanprover/lean-action@v1` was the wedge, not a slow
      # step: run 43527300771 spent 885566ms (14m45s) inside the action's own
      # `lake exe cache get`, reached the 30-minute job ceiling, and the run
      # concluded `cancelled` with this ratchet step's PASS (2m03s, undisclosed
      # 0 == baseline 0) discarded by the job-level cancellation. That action
      # seeds the Mathlib cache with no preflight, and on this estate
      # `.lake/packages/*` are symlinks into the machine-wide cache every other
      # build reads -- so the download wrote through shared state. The ratchet
      # needs no toolchain; it is a text scan, seconds.

  soundness:
    # Self-hosted: elan and the toolchain pinned by lean-toolchain are already
    # installed. The Mathlib dependency arrives by BINDING the machine-wide warm
    # cache (scripts/warm_cache.py), not by downloading it -- see the seed note
    # below. Job ceiling 60: every step under it carries its own ceiling and
    # they sum to 52, so a step always reports its own name before the job
    # bound can fire. A job-level cancellation is what made run 43547320929
    # useless: it concluded `cancelled` with the gate step never executed.
    runs-on: [self-hosted, lean]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bind the estate warm Mathlib cache
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lake >/dev/null 2>&1; then
            echo "::error::lake not on PATH; the pinned toolchain is missing on this runner"
            exit 1
          fi
          # Why this replaced `lake exe cache get`. On run 43547320929 that step
          # ran 02:43:11 -> 03:27:31 (44m20s), was cut by the job ceiling, and
          # cancelled the job before the build, the unit tests and the axiom gate
          # had run -- the fourth `cancelled` in a row for this repository, with
          # the corpus never once checked. The estate already keeps one built
          # Mathlib per revision in ~/.lean-cache(-ci)/mathlib/<rev> and every
          # lane reaches it by symlinking the package dir; a clean-room CI-shaped
          # checkout doing the same built Economy in 123.64s with no download.
          # warm_cache.py is that bind, and it only ever creates a link where
          # nothing real stands: it never deletes and never writes through a
          # symlink, which is the vector that would corrupt the shared cache for
          # every other build on this host.
          rc=0
          python3 scripts/warm_cache.py --apply \
            --json "${RUNNER_TEMP:-/tmp}/warm-cache.json" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ -d .lake/packages ] && [ -n "$(find .lake/packages -maxdepth 1 -type l 2>/dev/null)" ]; then
              echo "::error file=.github/workflows/ci.yml::.lake/packages contains symlinks and warm_cache.py refused (rc=$rc); refusing lake exe cache get to avoid writing through shared cache symlinks"
              exit 1
            fi
            # No provably warm generation here (a GitHub-hosted runner, or a
            # revision nobody has built). Fetch instead -- bounded, so a slow
            # CDN cannot eat the job again.
            echo "::notice file=.github/workflows/ci.yml::no estate warm generation for this manifest (bind exited $rc); falling back to a bounded cache fetch"
            if command -v timeout >/dev/null 2>&1; then
              timeout 240 lake exe cache get || {
                echo "::error::the bounded cache fetch did not finish in 240s on a runner with no warm generation; this is an environment finding, not a corpus verdict"
                exit 1
              }
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout 240 lake exe cache get || {
                echo "::error::the bounded cache fetch did not finish in 240s on a runner with no warm generation; this is an environment finding, not a corpus verdict"
                exit 1
              }
            else
              echo "::error::no timeout(1) on this runner, so the fallback fetch would be unbounded; refusing to start it"
              exit 1
            fi
          fi

      - name: Build corpus
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          # Bounded for the same reason as the step above: an unbounded
          # `lake build` on a cold tree means a from-source Mathlib, which is
          # hours and will be killed mid-flight with no named cause. Measured
          # against the warm bind: 123.64s for 3284 jobs.
          wall="timeout"
          command -v timeout >/dev/null 2>&1 || wall="gtimeout"
          if ! command -v "$wall" >/dev/null 2>&1; then
            echo "::warning::no timeout(1) on this runner; the step ceiling is the only bound"
            lake build Economy
            exit 0
          fi
          "$wall" 600 lake build Economy || {
            rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::lake build Economy hit its 600s bound (rc=$rc): the dependency cache is not warm on this runner, so this is an environment finding, not a soundness verdict"
            fi
            exit "$rc"
          }

      - name: Gate unit tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Axiom, sorry and README census gate (kernel-checked)
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # --slot-wait: the probe batches queue for a build slot instead of
          # sprawling over the host unleased. A refusal exits 2.
          # Exit 75 is its own answer: the kernel pass could not ask every
          # declaration even after splitting each walled batch, so this run
          # carries NO soundness verdict. It stays red -- the receipts on the
          # blog must not rest on a partial pass -- but it is labelled as a
          # retry, never as 80 findings against theorems nobody checked.
          rc=0
          python3 scripts/audit_axioms.py --check --verify-kernel --slot-wait 900 \
            --json "${RUNNER_TEMP:-/tmp}/axiom-audit.json" || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::error title=Kernel pass incomplete (retry, not unsound)::the axiom gate finished its static half but the kernel never answered every declaration. Re-run this workflow; treat the corpus as unverified, not as failed."
          fi
          exit "$rc"
